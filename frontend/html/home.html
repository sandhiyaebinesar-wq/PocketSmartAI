<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home Planner - PocketSmart AI</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            PocketSmart AI
        </div>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="history.html">History</a>
            <a href="index.html" onclick="logout()">Logout</a>
        </nav>

    </header>


    <main class="planner-page">

        <div class="planner-form-card">

            <h1>🏠 Home Planner</h1>

            <p>
                Tell us about your home and budget.
                PocketSmart AI will suggest suitable ideas.
            </p>


            <form id="homeForm">

                <label for="homeBudget">
                    Budget (₹)
                </label>

                <input
                    type="number"
                    id="homeBudget"
                    placeholder="Example: 10000"
                    min="1"
                    required
                >


                <label for="room">
                    Room
                </label>

                <select id="room" required>

                    <option value="Living Room">
                        Living Room
                    </option>

                    <option value="Bedroom">
                        Bedroom
                    </option>

                    <option value="Kitchen">
                        Kitchen
                    </option>

                    <option value="Study Room">
                        Study Room
                    </option>

                </select>


                <label for="style">
                    Style
                </label>

                <select id="style" required>

                    <option value="Modern">
                        Modern
                    </option>

                    <option value="Minimal">
                        Minimal
                    </option>

                    <option value="Traditional">
                        Traditional
                    </option>

                    <option value="Bohemian">
                        Bohemian
                    </option>

                </select>


                <label for="people">
                    Number of People
                </label>

                <input
                    type="number"
                    id="people"
                    placeholder="Example: 4"
                    min="1"
                    required
                >


                <button type="submit" class="btn">
                    Get AI Recommendations 🤖
                </button>

            </form>


            <p id="homeMessage" class="message"></p>

        </div>

    </main>


    <script src="../js/app.js"></script>

</body>

</html>
