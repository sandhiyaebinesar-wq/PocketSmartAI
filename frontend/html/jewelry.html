<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jewelry Planner - PocketSmart AI</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            PocketSmart AI
        </div>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="history.html">History</a>
            <a href="index.html" onclick="logout()">Logout</a>
        </nav>

    </header>


    <main class="planner-page">

        <div class="planner-form-card">

            <h1>💎 Jewelry Planner</h1>

            <p>
                Enter your occasion, metal preference and budget.
                PocketSmart AI will suggest suitable jewelry.
            </p>


            <form id="jewelryForm">

                <label for="jewelryBudget">
                    Budget (₹)
                </label>

                <input
                    type="number"
                    id="jewelryBudget"
                    placeholder="Example: 25000"
                    min="1"
                    required
                >


                <label for="occasion">
                    Occasion
                </label>

                <select id="occasion" required>

                    <option value="Casual">
                        Casual
                    </option>

                    <option value="Wedding">
                        Wedding
                    </option>

                    <option value="Engagement">
                        Engagement
                    </option>

                    <option value="Party">
                        Party
                    </option>

                    <option value="Anniversary">
                        Anniversary
                    </option>

                </select>


                <label for="metal">
                    Metal Preference
                </label>

                <select id="metal" required>

                    <option value="Gold">
                        Gold
                    </option>

                    <option value="Silver">
                        Silver
                    </option>

                    <option value="Diamond">
                        Diamond
                    </option>

                    <option value="Platinum">
                        Platinum
                    </option>

                </select>


                <button type="submit" class="btn">
                    Get AI Recommendations 🤖
                </button>

            </form>


            <p id="jewelryMessage" class="message"></p>

        </div>

    </main>


    <script src="../js/app.js"></script>

</body>

</html>
