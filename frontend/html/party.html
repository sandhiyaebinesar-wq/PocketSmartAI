<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Party Planner - PocketSmart AI</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            PocketSmart AI
        </div>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="history.html">History</a>
            <a href="index.html" onclick="logout()">Logout</a>
        </nav>

    </header>


    <main class="planner-page">

        <div class="planner-form-card">

            <h1>🎉 Party Planner</h1>

            <p>
                Enter your party details and budget.
                PocketSmart AI will create suitable recommendations.
            </p>


            <form id="partyForm">

                <label for="partyBudget">
                    Budget (₹)
                </label>

                <input
                    type="number"
                    id="partyBudget"
                    placeholder="Example: 15000"
                    min="1"
                    required
                >


                <label for="event">
                    Event
                </label>

                <select id="event" required>

                    <option value="Birthday">
                        Birthday
                    </option>

                    <option value="Wedding">
                        Wedding
                    </option>

                    <option value="Anniversary">
                        Anniversary
                    </option>

                    <option value="Engagement">
                        Engagement
                    </option>

                    <option value="Baby Shower">
                        Baby Shower
                    </option>

                </select>


                <label for="guests">
                    Number of Guests
                </label>

                <input
                    type="number"
                    id="guests"
                    placeholder="Example: 20"
                    min="1"
                    required
                >


                <label for="theme">
                    Theme
                </label>

                <select id="theme" required>

                    <option value="Simple">
                        Simple
                    </option>

                    <option value="Elegant">
                        Elegant
                    </option>

                    <option value="Colorful">
                        Colorful
                    </option>

                    <option value="Traditional">
                        Traditional
                    </option>

                    <option value="Modern">
                        Modern
                    </option>

                </select>


                <button type="submit" class="btn">
                    Get AI Recommendations 🤖
                </button>

            </form>


            <p id="partyMessage" class="message"></p>

        </div>

    </main>


    <script src="../js/app.js"></script>

</body>

</html>
